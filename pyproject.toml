[project]
name = "vlmrl"
version = "0.1.0"
description = "Minimal multi-turn VLM-RL (PEAR-style GRPO) for arbitrary HF VLMs and arbitrary (sim / world-model) environments"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "torchvision",
  "transformers>=4.57",
  "accelerate",
  "numpy",
  "pillow",
  "imageio",
]

[project.optional-dependencies]
pointmaze = ["gymnasium>=1.0", "gymnasium-robotics>=1.3", "mujoco>=3.0"]
offline = ["minari[hdf5]"]
lora = ["peft"]
wandb = ["wandb"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vlmrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "slow: loads a real (tiny) HF VLM; enable with --run-slow",
  "gpu: needs CUDA; enable with --run-gpu",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
