# smolvlm-procgen-v2 follow-up queue (after the loss-mask fix), run by the scratchpad queue script once the GPU's
# earlier v2 runs finish; 40 steps; aborted after step 3 if fewer than 6 groups carried a GRPO signal (no valid
# replies to learn from). SmolVLM-256M, `simple` prompt (100% invalid zero-shot in v1; the abort rule ends it if still so).
group: smolvlm-procgen-v2
project: vlm-rl-pointmaze
train_gpu: 0
vllm_gpu: 0
vllm_port: 8011
vllm_gpu_util: 0.35
overrides:
  - experiment=pointmaze_procgen
  - policy=smolvlm256m
  - on_invalid=noop
  - reward=success
  - steps=40
  - groups_per_step=64
  - group_size=16
  - max_resample_rounds=3
  - micro_batch_size=32
  - eval_every=5
  - eval_episodes=64
  - wandb_entity=tri
  - "wandb_tags='pointmaze,procgen,smolvlm,fft,sweep'"
grid:
  env_kwargs.prompt_style: [simple]
  lr: [1.0e-5]   # 3e-5 collapsed 256M even after the mask fix
  max_new_tokens: [128]
vllm_args:
  HuggingFaceTB/SmolVLM-256M-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}', --api-server-count, "4", --max-num-seqs, "1024", --mm-processor-cache-gb, "0"]
