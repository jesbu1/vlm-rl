# smolvlm-procgen-v2, GPU 0: seed-1 replicate of the 128 x 16 run (seed 0 on GPU1). The best recipe (SmolVLM2-500M compact_rel, 192 tokens + parse_last,
# on_invalid=terminate, lr=5e-6) with a **2x batch**: 128 groups x 16 = 2048 episodes per step instead of 64 x 16.
# Three seeds at 64 groups plateau at ~30% greedy; does a larger batch (less noisy gradient) lift the plateau or
# just cost twice the rollout time? The 2048-episode runs sat ~1-3 points above the 64 x 16 seeds at steps 30-40 (within
# single-eval noise); a second seed tests whether that holds.
group: smolvlm-procgen-v2
project: vlm-rl-pointmaze
train_gpu: 0
vllm_gpu: 0
vllm_port: 8011
vllm_gpu_util: 0.35
overrides:
  - experiment=pointmaze_procgen
  - eval_on_invalid=noop
  - reward=success
  - steps=40
  - group_size=16
  - max_resample_rounds=3
  - micro_batch_size=16
  - eval_every=5
  - eval_episodes=64
  - wandb_entity=tri
  - "wandb_tags='pointmaze,procgen,smolvlm2-500m,fft,sweep'"
grid:
  groups_per_step: [128]   # in the grid so the run name (and out_dir) differ from the 64-group runs
  on_invalid: [terminate]   # in the grid so the run name (and out_dir) differ from the noop run
  policy: [smolvlm2_500m]   # in the grid so the run name (and out_dir) differ from the 256M runs in this group
  env_kwargs.prompt_style: [compact_rel]
  lr: [5.0e-6]
  max_new_tokens: [192]
  env_kwargs.parse_last: [true]
  seed: [1]
vllm_args:
  HuggingFaceTB/SmolVLM2-500M-Video-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}', --api-server-count, "4", --max-num-seqs, "1024", --mm-processor-cache-gb, "0"]
