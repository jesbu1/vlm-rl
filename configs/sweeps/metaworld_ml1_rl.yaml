# GRPO on single Metaworld tasks (experiment=metaworld_ml1): reach (easiest) and push (scripted expert 100% through
# the text protocol), sparse success reward, 16 groups x 8, 40 steps. Submit the model / prompt that does best
# zero-shot (configs/sweeps/metaworld_zeroshot.yaml) with --only / --set, e.g. on 4-GPU machines, 2 GPUs per run:
#   python scripts/batch_submit.py configs/sweeps/metaworld_ml1_rl.yaml --queue <4-gpu queue> --gpus 4 \
#       --gpus_per_lane 2 --only 'qwen3vl4b' --set env_kwargs.prompt_style=pear
group: metaworld-ml1-rl-v1
project: vlm-rl-metaworld
vllm_port: 8011
overrides:
  - experiment=metaworld_ml1
  - reward=success
  - save_every=40
  - resume_every=5
  - "wandb_tags='metaworld,ml1,rl'"
grid:
  policy: [qwen3vl4b_lora, qwen3vl2b_full, gemma4_e2b_full_48gb]
  env_kwargs.benchmark: [ML1:reach-v3, ML1:push-v3]
vllm_args:
  google/gemma-4-E2B-it: [--mm-processor-cache-gb, "0"]
  Qwen/Qwen3-VL-2B-Instruct: [--mm-processor-cache-gb, "0"]
  Qwen/Qwen3-VL-4B-Instruct: [--mm-processor-cache-gb, "0"]
