# Zero-shot (steps=0): the models' built-in thinking modes (chat template enable_thinking=true) for the two
# models whose templates have one (Gemma 4 E2B, MiniCPM-V 4.6; Qwen3-VL-4B-Instruct and SmolVLM ignore it).
# Thinking is long, so a larger reply budget than zeroshot_think.yaml. Same eval start states as v5.
group: zeroshot-native-think
project: vlm-rl-pointmaze
train_gpu: 0
vllm_gpu: 1
vllm_port: 8011
overrides:
  - experiment=pointmaze_q3vl4b_vllm
  - steps=0
  - eval_episodes=32
  - reward=success
  - max_new_tokens=4096
  - +chat_template_kwargs.enable_thinking=true
  - env_kwargs.think=false          # isolate native thinking from the "Think briefly" cue
  - wandb_entity=tri
  - "wandb_tags='pointmaze,zeroshot,prompt-ablation,thinking'"
  - env_kwargs.max_turns=15
grid:
  policy: [gemma4_e2b_lora, minicpmv46_lora]
  env_kwargs.maze: [umaze, medium]
  env_kwargs.prompt_style: [pear, simple]
