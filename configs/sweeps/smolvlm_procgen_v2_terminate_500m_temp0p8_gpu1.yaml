# smolvlm-procgen-v2, GPU 1: the other side of the temperature axis. Same as the default recipe
# (smolvlm_procgen_v2_terminate_500m_lr5e6_gpu1.yaml: SmolVLM2-500M compact_rel, 192 tokens + parse_last,
# on_invalid=terminate, lr=5e-6, 64 x 16, seed 0) but training rollouts at **temperature 0.8** (eval stays greedy).
# T=1.2 left most early rollouts invalid. Its greedy eval then froze (seed 0, no KL: 25.5%) or ran below T=1.0 (with KL:
# ~26.6% at steps 30-35). Does cooler sampling, with fewer junk replies and more groups with signal, beat T=1.0's ~29.7%,
# or does it explore too little?
group: smolvlm-procgen-v2
project: vlm-rl-pointmaze
train_gpu: 1
vllm_gpu: 1
vllm_port: 8012
vllm_gpu_util: 0.35
overrides:
  - experiment=pointmaze_procgen
  - eval_on_invalid=noop
  - reward=success
  - steps=40
  - groups_per_step=64
  - group_size=16
  - max_resample_rounds=3
  - micro_batch_size=16
  - eval_every=5
  - eval_episodes=64
  - wandb_entity=tri
  - "wandb_tags='pointmaze,procgen,smolvlm2-500m,fft,sweep'"
grid:
  on_invalid: [terminate]
  policy: [smolvlm2_500m]
  env_kwargs.prompt_style: [compact_rel]
  lr: [5.0e-6]
  max_new_tokens: [192]
  env_kwargs.parse_last: [true]
  temperature: [0.8]   # in the grid so the run name (and out_dir) differ from the default run
vllm_args:
  HuggingFaceTB/SmolVLM2-500M-Video-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}', --api-server-count, "4", --max-num-seqs, "1024", --mm-processor-cache-gb, "0"]
