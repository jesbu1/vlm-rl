# smolvlm-procgen-v2, GPU 0: independent replication of the temperature=1.2 fast start. Same as
# smolvlm_procgen_v2_terminate_500m_temp1p2_gpu1.yaml (default recipe with training rollouts at T=1.2, greedy eval) but
# **seed 1**. With seed 0, T=1.2 reached 30.7% greedy eval at step 5 (T=1.0 seed 0: 14.6%), then sharpened (log-prob
# -0.09) and froze at 25.5% for steps 20-30. T=1.0 seed 1: 29.0% mean over steps 30-40. Launched by hand: the queue's
# collapse rule (rollout invalid > 85% twice after step 5) would misfire on the hot early rollouts.
group: smolvlm-procgen-v2
project: vlm-rl-pointmaze
train_gpu: 0
vllm_gpu: 0
vllm_port: 8011
vllm_gpu_util: 0.35
overrides:
  - experiment=pointmaze_procgen
  - eval_on_invalid=noop
  - reward=success
  - steps=40
  - groups_per_step=64
  - group_size=16
  - max_resample_rounds=3
  - micro_batch_size=16
  - eval_every=5
  - eval_episodes=64
  - wandb_entity=tri
  - "wandb_tags='pointmaze,procgen,smolvlm2-500m,fft,sweep'"
grid:
  on_invalid: [terminate]
  policy: [smolvlm2_500m]
  env_kwargs.prompt_style: [compact_rel]
  lr: [5.0e-6]
  max_new_tokens: [192]
  env_kwargs.parse_last: [true]
  temperature: [1.2]
  seed: [1]   # in the grid so the run name (and out_dir) differ from the seed-0 T=1.2 run
vllm_args:
  HuggingFaceTB/SmolVLM2-500M-Video-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}', --api-server-count, "4", --max-num-seqs, "1024", --mm-processor-cache-gb, "0"]
