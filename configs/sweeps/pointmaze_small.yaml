# Used by scripts/sweep.py (not loaded by Hydra directly). Each run = base overrides + one grid point.
# Runs are grouped by model in first-appearance order. Per-model training settings come from the
# policy presets; per-model vLLM server flags from `vllm_args`.
# v5: PEAR protocol (current defaults), sparse reward=success, UMaze and medium. Models ordered by total
# parameter count, largest first (Gemma 4 E2B 5.1B, Qwen3-VL-4B 4.4B, MiniCPM-V 4.6 1.3B, SmolVLM 0.26B),
# all LoRA. Larger RL batch than v4 (16 groups x 16 vs 8 x 8): with a sparse reward and low success rate p,
# a group carries signal only if it mixes outcomes, P = 1 - (1-p)^G - p^G, so bigger groups and more groups
# keep the DAPO filter from discarding every group. Full fine-tuning of SmolVLM: pointmaze_small_fft.yaml.
group: pointmaze-small-v5
project: vlm-rl-pointmaze
train_gpu: 0
vllm_gpu: 1
vllm_port: 8011
overrides:
  - experiment=pointmaze_q3vl4b_vllm
  - steps=30
  - eval_every=5
  - reward=success
  - groups_per_step=16
  - group_size=16
  - max_new_tokens=512
  - wandb_entity=tri
  - "wandb_tags='pointmaze,pear,lora,sweep'"
  - env_kwargs.max_turns=15
grid:
  policy: [gemma4_e2b_lora, qwen3vl4b_lora, minicpmv46_lora, smolvlm256m_lora]
  env_kwargs.maze: [umaze, medium]
vllm_args:
  HuggingFaceTB/SmolVLM-256M-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}']
  HuggingFaceTB/SmolVLM2-2.2B-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}']
