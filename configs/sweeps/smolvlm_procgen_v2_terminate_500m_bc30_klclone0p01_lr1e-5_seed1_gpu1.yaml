# smolvlm-procgen-v2, GPU 1: BC-30 + KL 0.01 to the clone at RL lr=1e-5, seed 1. Seed 0 (GPU 0) so far: 15.1 (clone) /
# 16.1 / 21.4 / 32.8% at steps 0-15, ahead of lr=5e-6 KL seed 0 (29.2% at step 15), invalid replies ~0%, but the gain
# is mostly on the training layouts (42.2 vs 28.1% held-out at step 15). A second seed before reading anything into
# it. One change from the lr=1e-5 seed-0 run: seed (and GPU 1 / port 8012).
# lr=1e-5 seed-0 note:
# smolvlm-procgen-v2, GPU 0: BC-30 + KL 0.01 to the clone at lr=1e-5 (RL), seed 0. KL-to-clone at lr=5e-6 is flat:
# 4-seed steps 30-40 mean 38.1% (vs BC-30 36.2%, +1.9 paired, not significant), and seed 3 continued to step 70 stays at
# 37.5-42.2%. Without an anchor, lr=1e-5 collapsed (RL-only, invalid replies -> 77%); with KL to the *pretrained* model
# (256M) it was stable but stuck at ~23-25%. Untested: lr=1e-5 anchored to the BC-30 clone -- does the clone anchor let a
# faster lr climb past ~40%, or does it reintroduce the slide? One change from the KL 0.01 seed-0 run: lr 5e-6 -> 1e-5
# (bc_lr stays 1e-5, so the clone recipe is unchanged).
# KL 0.01 seed-0 note:
# smolvlm-procgen-v2, GPU 0: BC-30 + KL to the clone at kl_coef=0.01 (one change from the kl_coef=0.05 run, which
# stalled: rollouts flat at ~40% from step 6, evals 16.1 / 17.2 / 19.3 / 19.3% at steps 5-20 vs BC30's 44.3 / 41.1% peak
# at step 20; stopped there). A weaker pull: does it let RL climb and still damp the late slide? kl_coef=0.05 note:
# smolvlm-procgen-v2, GPU 0: BC-30 then RL with a KL penalty to the clone (kl_coef=0.05, kl_ref=clone), seed 0, lr 5e-6.
# BC-30 seeds plateau at 37.6% (steps 30-40) after peaking at 41-44% by step 20; traj_mean and lr 2.5e-6 did not
# move it, and BC-60 gave no better clone. The reference is the step-0 clone (ckpt_bc), not the pretrained model (kl_ref=pretrained would pull the
# policy back toward the un-cloned model). Tests whether staying near the clone keeps held-out success. Two
# changes from the BC-30 seed-0 run: kl_coef, kl_ref. Original note:
# behaviour cloning on the BFS shortest-path oracle, then RL. This is the other agent's Metaworld
# finding (scripts/report_notes/metaworld.md): "RL refines a good clone; it does not add generalization", and BC fixes
# the start when a model rarely samples good moves. Same as the default recipe (SmolVLM2-500M compact_rel, 192 tokens +
# parse_last, on_invalid=terminate, lr=5e-6, 64 x 16, T=1.0, seed 0) plus bc_steps=30: 30 updates on 64 oracle
# episodes each (the oracle solves 100% in 6-8 turns, written as compact_rel JSON replies), then 40 RL steps. The step-0
# eval is the clone. Baseline (RL only, seed 0): 29.7% mean over steps 30-40; scripted "echo + random escapes" 37.5%.
# bc_lr=1e-5: the clone's learning rate for full fine-tuning in reports/vlmrl_results.pdf (Appendix B, Gemma 4 E2B);
# RL keeps the maze default lr=5e-6.
group: smolvlm-procgen-v2
project: vlm-rl-pointmaze
train_gpu: 1
vllm_gpu: 1
vllm_port: 8012
vllm_gpu_util: 0.35
overrides:
  - experiment=pointmaze_procgen
  - eval_on_invalid=noop
  - reward=success
  - steps=40
  - groups_per_step=64
  - group_size=16
  - max_resample_rounds=3
  - micro_batch_size=16
  - bc_lr=1e-5
  - eval_every=5
  - eval_episodes=64
  - wandb_entity=tri
  - "wandb_tags='pointmaze,procgen,smolvlm2-500m,fft,sweep'"
grid:
  on_invalid: [terminate]
  policy: [smolvlm2_500m]
  env_kwargs.prompt_style: [compact_rel]
  lr: [1e-5]
  max_new_tokens: [192]
  env_kwargs.parse_last: [true]
  bc_steps: [30]   # in the grid so the run name (and out_dir) differ from the RL-only run
  kl_coef: [0.01]
  kl_ref: [clone]
  seed: [1]
vllm_args:
  HuggingFaceTB/SmolVLM2-500M-Video-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}', --api-server-count, "4", --max-num-seqs, "1024", --mm-processor-cache-gb, "0"]
