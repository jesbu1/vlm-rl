# smolvlm-procgen-v2, GPU 0: SmolVLM-256M, compact_rel, lr=5e-6, no KL, 40 steps.
# lr=1e-5 (smolvlm_procgen_v2_lr1e5_gpu0.yaml) also collapsed after the mask fix, just later: eval 22.4% (step 5) ->
# 19.3 -> 10.9 -> 7.3% (step 20), rollout invalid 4% -> 91%, grad norm 0.4 -> 6.8; stopped at step 20.
# (lr=3e-5 collapsed at steps 7-10.) Does halving the lr again hold? Also the max_frames=1 baseline for the frames2 A/B.
group: smolvlm-procgen-v2
project: vlm-rl-pointmaze
train_gpu: 0
vllm_gpu: 0
vllm_port: 8011
vllm_gpu_util: 0.35
overrides:
  - experiment=pointmaze_procgen
  - policy=smolvlm256m
  - on_invalid=noop
  - reward=success
  - steps=40
  - groups_per_step=64
  - group_size=16
  - max_resample_rounds=3
  - micro_batch_size=64
  - max_new_tokens=64
  - eval_every=5
  - eval_episodes=64
  - wandb_entity=tri
  - "wandb_tags='pointmaze,procgen,smolvlm,fft,sweep'"
grid:
  env_kwargs.prompt_style: [compact_rel]
  lr: [5.0e-6]
vllm_args:
  HuggingFaceTB/SmolVLM-256M-Instruct: [--max-model-len, "8192", --mm-processor-kwargs, '{"do_image_splitting": false}', --api-server-count, "4", --max-num-seqs, "1024", --mm-processor-cache-gb, "0"]
