# @package _global_
env: pointmaze
env_kwargs:
  maze: umaze              # open | umaze | medium | large | *_diverse_gr
  max_turns: 10
  image_size: 336
  include_state: true      # state JSON + goal coordinates in the prompt
  prompt_style: pear       # pear (paper App. H protocol) | simple
  think: null              # "Think briefly" cue; null = style default (simple: on, pear: off)
  settle: true             # act until target reached & at rest, or blocked (PEAR EXECUTION)
  start_states: random     # random | Minari id (e.g. D4RL/pointmaze/umaze-v2) | path.npz
  eval_start_states: random
  min_goal_dist: 1.5
  split: none              # train/eval split of random starts: none | pair (hold out start-goal cell pairs) | goal (hold out goal cells)
  holdout_frac: 0.25       # fraction of pairs (split=pair) or goal cells (split=goal) held out of training
  split_seed: 0
  eval_split: heldout      # part the eval sampler draws from when split != none: heldout | train | all
reward: success
